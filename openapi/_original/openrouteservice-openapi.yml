        build_date:
          type: string
          format: date-time
          description: Build date of the ORS engine
    IsochronesRequest:
      type: object
      required:
        - locations
        - range
      properties:
        locations:
          type: array
          description: >-
            Array of center coordinates for isochrone computation as [longitude, latitude] pairs.
            Maximum 5 locations per request.
          maxItems: 5
          items:
            type: array
            items:
              type: number
              format: double
            minItems: 2
            maxItems: 2
          example:
            - [8.681495, 49.41461]
        range:
          type: array
          description: >-
            Array of maximum travel range values. For time-based isochrones in seconds,
            for distance-based in meters. Maximum 10 values.
          maxItems: 10
          items:
            type: number
            format: double
          example:
            - 300
            - 600
        range_type:
          type: string
          description: The type of range to compute isochrones for
          enum:
            - time
            - distance
          default: time
        interval:
          type: number
          description: >-
            Interval for isochrone polygon rings. Creates concentric polygons at each
            interval within the maximum range.
          format: double
        units:
          type: string
          description: Units for range values when range_type is distance
          enum:
            - m
            - km
            - mi
          default: m
        area_units:
          type: string
          description: Units for area computation in the response
          enum:
            - m
            - km
            - mi
          default: m
        attributes:
          type: array
          description: Additional attributes to include in the response
          items:
            type: string
            enum:
              - area
              - reachfactor
              - total_pop
        intersections:
          type: boolean
          description: Compute intersections between isochrones
          default: false
        smoothing:
          type: number
          description: Smoothing factor for isochrone polygons (0-1)
          format: double
          minimum: 0
          maximum: 1
        avoid_features:
          type: array
          items:
            type: string
            enum:
              - highways
              - tollways
              - ferries
              - fords
        avoid_borders:
          type: string
          enum:
            - all
            - controlled
            - none
        avoid_polygons:
          type: object
          description: GeoJSON Polygon or MultiPolygon to avoid
        id:
          type: string
          description: Arbitrary identifier for tracking requests
    GeoJSONIsochronesResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - Feature
              geometry:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - Polygon
                  coordinates:
                    type: array
                    items:
                      type: array
                      items:
                        type: array
                        items:
                          type: number
              properties:
                type: object
                properties:
                  group_index:
                    type: integer
                  value:
                    type: number
                  center:
                    type: array
                    items:
                      type: number
                  area:
                    type: number
                  reachfactor:
                    type: number
                  total_pop:
                    type: integer
        bbox:
          type: array
          items:
            type: number
        metadata:
          type: object
    MatrixRequest:
      type: object
      required:
        - locations
      properties:
        locations:
          type: array
          description: >-
            Array of coordinates as [longitude, latitude] pairs for matrix computation.
            Used as both sources and destinations unless specified separately.
          items:
            type: array
            items:
              type: number
              format: double
            minItems: 2
            maxItems: 2
          example:
            - [8.681495, 49.41461]
            - [8.686507, 49.41943]
            - [8.687872, 49.420318]
        sources:
          type: array
          description: Indices into locations array to use as sources (origins)
          items:
            type: integer
        destinations:
          type: array
          description: Indices into locations array to use as destinations
          items:
            type: integer
        metrics:
          type: array
          description: Metrics to compute for the matrix
          items:
            type: string
            enum:
              - duration
              - distance
          default:
            - duration
        resolve_locations:
          type: boolean
          description: Return nearest road network location for each coordinate
          default: false
        units:
          type: string
          description: Distance units (only applicable when distance metric requested)
          enum:
            - m
            - km
            - mi
          default: m
        id:
          type: string
          description: Arbitrary identifier for tracking requests
    JSONMatrixResponse:
      type: object
      properties:
