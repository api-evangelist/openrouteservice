openapi: 3.0.3
info:
  title: OpenRouteService API
  description: >-
    OpenRouteService is a free, open-source geospatial API platform built on OpenStreetMap data.
    It provides routing directions for multiple transport modes, isochrones for reachability
    analysis, time-distance matrices, geocoding, elevation data, points of interest, and
    vehicle route optimization for logistics and humanitarian use cases.
  version: v2
  contact:
    name: OpenRouteService Support
    url: https://ask.openrouteservice.org
    email: support@smartmobility.heigit.org
  license:
    name: GNU General Public License v3.0
    url: https://github.com/GIScience/openrouteservice/blob/main/LICENSE
  x-ors-docs: https://giscience.github.io/openrouteservice/
servers:
  - url: https://api.openrouteservice.org
    description: OpenRouteService Public API
security:
  - ApiKeyAuth: []
tags:
  - name: Directions
    description: Get routing directions for different modes of transport
  - name: Isochrones
    description: Obtain areas of reachability from given locations
  - name: Matrix
    description: Obtain one-to-many, many-to-one and many-to-many matrices for time and distance
  - name: Geocoding
    description: Resolve addresses to coordinates and vice versa using Pelias engine
  - name: Elevation
    description: Return elevation data for point or line geometries
  - name: Optimization
    description: Solve vehicle routing problems using the VROOM engine
  - name: POI
    description: Return points of interest using OpenStreetMap data
  - name: Snapping
    description: Snap coordinates to the nearest road network nodes
  - name: Health
    description: Service health and status endpoints
paths:
  /v2/directions/{profile}:
    get:
      tags:
        - Directions
      summary: Get basic route (GET)
      description: >-
        Get a basic route between two points with the profile provided. Returned response
        is in GeoJSON format. Accepts start and end coordinates as query parameters.
      operationId: getDirectionsGet
      parameters:
        - $ref: '#/components/parameters/profile'
        - name: start
          in: query
          description: Start coordinate of the route as longitude,latitude
          required: true
          schema:
            type: string
            example: '8.681495,49.41461'
        - name: end
          in: query
          description: Destination coordinate of the route as longitude,latitude
          required: true
          schema:
            type: string
            example: '8.687872,49.420318'
      responses:
        '200':
          description: Successfully computed route in GeoJSON format
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Directions
      summary: Get directions (POST JSON)
      description: >-
        Returns a route between two or more locations for a selected profile and its settings
        as JSON. The response contains the route geometry and additional information like
        distance, duration, and turn-by-turn instructions.
      operationId: getDirectionsPost
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionsRequest'
      responses:
        '200':
          description: Successfully computed route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/directions/{profile}/geojson:
    post:
      tags:
        - Directions
      summary: Get directions as GeoJSON (POST)
      description: >-
        Returns a route between two or more locations for a selected profile and its settings
        as GeoJSON. The response is a FeatureCollection with route geometry.
      operationId: getDirectionsGeoJson
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionsRequest'
      responses:
        '200':
          description: Successfully computed route in GeoJSON format
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/directions/{profile}/gpx:
    post:
      tags:
        - Directions
      summary: Get directions as GPX (POST)
      description: >-
        Returns a route between two or more locations for a selected profile and its settings
        as GPX format for GPS device compatibility.
      operationId: getDirectionsGpx
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionsRequest'
      responses:
        '200':
          description: Successfully computed route in GPX format
          content:
            application/gpx+xml:
              schema:
                type: string
                format: xml
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/isochrones/{profile}:
    post:
      tags:
        - Isochrones
      summary: Isochrones Service
      description: >-
        The Isochrone Service supports time and distance analyses for one single or multiple
        locations. You may also specify the travel mode and a maximum range value. This service
        responses with polygon or point geometries, depending on your request.
      operationId: getIsochrones
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsochronesRequest'
      responses:
        '200':
          description: Successfully computed isochrones
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONIsochronesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/matrix/{profile}:
    post:
      tags:
        - Matrix
      summary: Matrix Service
      description: >-
        Computes one-to-many, many-to-one or many-to-many time/distance matrices for all
        pairs of the supplied coordinates. The maximum number of locations depends on the
        subscription plan (up to 3,500 for standard).
      operationId: getMatrix
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixRequest'
      responses:
        '200':
          description: Successfully computed matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONMatrixResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode/search:
    get:
      tags:
        - Geocoding
      summary: Forward Geocoding
      description: >-
        Resolves a text address query to geographic coordinates using the Pelias geocoding
        engine. Returns matching locations ordered by relevance.
      operationId: geocodeSearch
      parameters:
        - name: text
          in: query
          description: The address or place name to search for
          required: true
          schema:
            type: string
            example: 'Heidelberg, Germany'
        - name: boundary.country
          in: query
          description: Restrict results to a specific country using ISO 3166-1 alpha-2 or alpha-3 code
          required: false
          schema:
            type: string
            example: 'DE'
        - name: boundary.rect.min_lon
          in: query
          description: Minimum longitude for bounding box restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.rect.min_lat
          in: query
          description: Minimum latitude for bounding box restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.rect.max_lon
          in: query
          description: Maximum longitude for bounding box restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.rect.max_lat
          in: query
          description: Maximum latitude for bounding box restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.circle.lon
          in: query
          description: Longitude of circle center for circular boundary restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.circle.lat
          in: query
          description: Latitude of circle center for circular boundary restriction
          required: false
          schema:
            type: number
            format: double
        - name: boundary.circle.radius
          in: query
          description: Radius in kilometers for circular boundary restriction
          required: false
          schema:
            type: number
            format: double
        - name: focus.point.lon
          in: query
          description: Longitude of focus point to bias nearby results higher
          required: false
          schema:
            type: number
            format: double
        - name: focus.point.lat
          in: query
          description: Latitude of focus point to bias nearby results higher
          required: false
          schema:
            type: number
            format: double
        - name: size
          in: query
          description: Number of results to return (max 40)
          required: false
          schema:
            type: integer
            default: 10
            maximum: 40
        - name: layers
          in: query
          description: Filter by Pelias layer types (venue, address, street, neighbourhood, etc.)
          required: false
          schema:
            type: string
        - name: sources
          in: query
          description: Filter by data sources (openstreetmap, openaddresses, whosonfirst, geonames)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Geocoding results as GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode/reverse:
    get:
      tags:
        - Geocoding
      summary: Reverse Geocoding
      description: >-
        Resolves geographic coordinates to a human-readable address using the Pelias engine.
        Returns the nearest address or place for the given coordinates.
      operationId: geocodeReverse
      parameters:
        - name: point.lon
          in: query
          description: Longitude of the point to reverse geocode
          required: true
          schema:
            type: number
            format: double
            example: 8.681495
        - name: point.lat
          in: query
          description: Latitude of the point to reverse geocode
          required: true
          schema:
            type: number
            format: double
            example: 49.41461
        - name: boundary.circle.radius
          in: query
          description: Radius in kilometers to search around the point
          required: false
          schema:
            type: number
            format: double
            default: 1
        - name: size
          in: query
          description: Number of results to return
          required: false
          schema:
            type: integer
            default: 1
            maximum: 40
        - name: layers
          in: query
          description: Filter by Pelias layer types
          required: false
          schema:
            type: string
        - name: sources
          in: query
          description: Filter by data sources
          required: false
          schema:
            type: string
        - name: boundary.country
          in: query
          description: Restrict results to a specific country
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Reverse geocoding results as GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode/autocomplete:
    get:
      tags:
        - Geocoding
      summary: Geocoding Autocomplete
      description: >-
        Returns address suggestions as the user types, optimized for low-latency typeahead
        searches. Uses Pelias autocomplete for partial address matching.
      operationId: geocodeAutocomplete
      parameters:
        - name: text
          in: query
          description: Partial address text for autocomplete suggestions
          required: true
          schema:
            type: string
            example: 'Heidel'
        - name: focus.point.lon
          in: query
          description: Longitude of focus point to bias nearby results higher
          required: false
          schema:
            type: number
            format: double
        - name: focus.point.lat
          in: query
          description: Latitude of focus point to bias nearby results higher
          required: false
          schema:
            type: number
            format: double
        - name: boundary.country
          in: query
          description: Restrict results to a specific country
          required: false
          schema:
            type: string
        - name: layers
          in: query
          description: Filter by Pelias layer types
          required: false
          schema:
            type: string
        - name: sources
          in: query
          description: Filter by data sources
          required: false
          schema:
            type: string
        - name: size
          in: query
          description: Number of results to return (max 40)
          required: false
          schema:
            type: integer
            default: 10
            maximum: 40
      responses:
        '200':
          description: Autocomplete suggestions as GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /elevation/point:
    get:
      tags:
        - Elevation
      summary: Get elevation for a point
      description: >-
        Returns the elevation value for a single geographic point using SRTM elevation data.
      operationId: getElevationPoint
      parameters:
        - name: geometry
          in: query
          description: Coordinate as longitude,latitude
          required: true
          schema:
            type: string
            example: '8.681495,49.41461'
        - name: format_in
          in: query
          description: Input geometry format (point)
          required: false
          schema:
            type: string
            enum:
              - point
            default: point
        - name: format_out
          in: query
          description: Output format (point or geojson)
          required: false
          schema:
            type: string
            enum:
              - point
              - geojson
            default: geojson
        - name: dataset
          in: query
          description: Elevation dataset to use
          required: false
          schema:
            type: string
            enum:
              - srtm
            default: srtm
      responses:
        '200':
          description: Elevation data for the point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElevationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Elevation
      summary: Get elevation for a point (POST)
      description: >-
        Returns the elevation value for a single geographic point using SRTM elevation data.
        POST variant for larger payloads.
      operationId: postElevationPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevationPointRequest'
      responses:
        '200':
          description: Elevation data for the point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElevationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /elevation/line:
    post:
      tags:
        - Elevation
      summary: Get elevation for a line geometry
      description: >-
        Returns elevation values for a series of points along a line geometry using SRTM data.
        Supports up to 2,000 vertices per request.
      operationId: getElevationLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevationLineRequest'
      responses:
        '200':
          description: Elevation data for the line geometry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElevationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /optimization:
    post:
      tags:
        - Optimization
      summary: Vehicle Route Optimization
      description: >-
        Solves vehicle routing problems using the VROOM optimization engine. Supports time
        windows, capacity constraints, multi-depot scenarios, and mixed fleet routing for
        logistics planning with up to 3 vehicles and 50 jobs in the standard plan.
      operationId: getOptimization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationRequest'
      responses:
        '200':
          description: Optimized route solution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /pois:
    post:
      tags:
        - POI
      summary: Points of Interest
      description: >-
        Returns points of interest in the area surrounding a given geometry. Supports search
        within a 2 km radius for areas up to 50 km2, filtered by category and keyword using
        OpenStreetMap POI data.
      operationId: getPOIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POIRequest'
      responses:
        '200':
          description: Points of interest as GeoJSON FeatureCollection
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/POIResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/snap/{profile}:
    post:
      tags:
        - Snapping
      summary: Snap Coordinates to Road Network
      description: >-
        Snaps arbitrary coordinates to the nearest road network nodes. Supports up to 5,000
        locations per request, useful for map matching and correcting GPS coordinates to the
        road network.
      operationId: snapCoordinates
      parameters:
        - $ref: '#/components/parameters/profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnappingRequest'
      responses:
        '200':
          description: Snapped coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/health:
    get:
      tags:
        - Health
      summary: Health Check
      description: Returns the health status of the OpenRouteService API
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
  /v2/status:
    get:
      tags:
        - Health
      summary: Status Check
      description: Returns the current status and configuration of the OpenRouteService API including loaded profiles
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Service status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Service unavailable
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key obtained from https://openrouteservice.org
  parameters:
    profile:
      name: profile
      in: path
      description: Specifies the transport mode profile for routing
      required: true
      schema:
        type: string
        enum:
          - driving-car
          - driving-hgv
          - cycling-regular
          - cycling-road
          - cycling-mountain
          - cycling-electric
          - foot-walking
          - foot-hiking
          - wheelchair
        example: driving-car
  responses:
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - API key does not have permission for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found - route or resource could not be found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DirectionsRequest:
      type: object
      required:
        - coordinates
      properties:
        coordinates:
          type: array
          description: >-
            The waypoints to use for the route as an array of [longitude, latitude] pairs.
            Minimum 2, maximum 50 waypoints.
          minItems: 2
          maxItems: 50
          items:
            type: array
            items:
              type: number
              format: double
            minItems: 2
            maxItems: 2
          example:
            - [8.681495, 49.41461]
            - [8.686507, 49.41943]
            - [8.687872, 49.420318]
        profile:
          type: string
          description: Override the profile for this request (alternative to path parameter)
          enum:
            - driving-car
            - driving-hgv
            - cycling-regular
            - cycling-road
            - cycling-mountain
            - cycling-electric
            - foot-walking
            - foot-hiking
            - wheelchair
        preference:
          type: string
          description: Specifies the routing preference
          enum:
            - fastest
            - shortest
            - recommended
          default: recommended
        units:
          type: string
          description: Units for distances
          enum:
            - m
            - km
            - mi
          default: m
        language:
          type: string
          description: Language for turn-by-turn instructions (IETF BCP 47 language tag)
          example: en
          default: en
        geometry:
          type: boolean
          description: Return route geometry
          default: true
        geometry_simplify:
          type: boolean
          description: Simplify the geometry for smaller response size
          default: false
        instructions:
          type: boolean
          description: Return turn-by-turn instructions
          default: true
        instructions_format:
          type: string
          description: Format for turn-by-turn instructions
          enum:
            - html
            - text
          default: text
        roundabout_exits:
          type: boolean
          description: Include roundabout exit information in instructions
          default: false
        attributes:
          type: array
          description: Additional route attributes to include in the response
          items:
            type: string
            enum:
              - avgspeed
              - detourfactor
              - percentage
        extra_info:
          type: array
          description: Extra information to include for route segments
          items:
            type: string
            enum:
              - steepness
              - suitability
              - surface
              - waycategory
              - waytype
              - tollways
              - traildifficulty
              - osmid
              - roadaccessrestrictions
              - countryinfo
              - green
              - noise
        elevation:
          type: boolean
          description: Include elevation values for route points
          default: false
        continue_straight:
          type: boolean
          description: Force straight routes at waypoints, restricting u-turns
        avoid_features:
          type: array
          description: Features to avoid during routing
          items:
            type: string
            enum:
              - highways
              - tollways
              - ferries
              - fords
              - steps
        avoid_borders:
          type: string
          description: Border crossing restriction
          enum:
            - all
            - controlled
            - none
        avoid_countries:
          type: array
          description: List of ISO 3166-1 alpha-3 country codes to avoid
          items:
            type: string
        avoid_polygons:
          description: GeoJSON Polygon or MultiPolygon geometry to avoid
          type: object
        maximum_speed:
          type: number
          description: Maximum speed for the route in km/h (HGV profiles only)
          format: double
        alternative_routes:
          type: object
          description: Configuration for alternative route computation
          properties:
            target_count:
              type: integer
              description: Number of alternative routes to compute (max 3)
              maximum: 3
            weight_factor:
              type: number
              description: Factor by which alternative routes can be longer than the optimal route
              format: double
            share_factor:
              type: number
              description: Minimum share factor for alternative route similarity
              format: double
    RouteOptions:
      type: object
      properties:
        avoid_borders:
          type: string
          enum:
